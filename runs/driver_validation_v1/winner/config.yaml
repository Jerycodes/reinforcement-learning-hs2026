run_name: long_horizon
seed: 2
total_timesteps: 102400
n_envs: 10
env:
  laps: 2
  max_time: 150.0
  random_start: true
  start_speed_max: 8.0
  off_track_margin: 0.1
  off_track_mode: terminate
  reward_progress: 1.0
  reward_off_track: -20.0
  reward_steer_change: 0.05
ppo:
  learning_rate: 3.0e-05
  lr_schedule: constant
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.997
  gae_lambda: 0.97
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes:
  - 256
  - 256
  activation: tanh
  log_std_init: -0.5
normalize_reward: true
checkpoint_every: 200000
eval_every: 100000
eval_laps: 2
algo: ppo
calibration:
  steering_gain: 0.94
  throttle_bias: -0.01
  throttle_gain: 1.0
