run_name: exp_domain_random
seed: 0
total_timesteps: 3000000
n_envs: 8
env:
  laps: 2
  max_time: 150.0
  random_start: true
  start_speed_max: 8.0
  off_track_margin: 0.4
  off_track_mode: terminate
  reward_progress: 1.0
  reward_off_track: -20.0
  reward_steer_change: 0.05
  domain_randomization:
    mu:
    - 0.9
    - 1.1
    mass:
    - 160.0
    - 200.0
ppo:
  learning_rate: 0.0003
  lr_schedule: linear
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes:
  - 256
  - 256
  activation: tanh
  log_std_init: -0.5
normalize_reward: true
checkpoint_every: 200000
eval_every: 100000
eval_laps: 2
